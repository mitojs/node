name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 20.19.0
          - os: ubuntu-24.04
            node: '22'
          - os: macos-15
            node: '22'
          - os: windows-2022
            node: '22'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Install native Linux musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: pnpm install --frozen-lockfile
      - name: Build current TypeScript and native Agent
        run: pnpm run build
      - name: Unit tests, packaging integrity, Rust tests
        run: |
          pnpm test
          node --test agent/tests/build-script.test.cjs
          cargo test --locked --manifest-path agent/Cargo.toml
      - name: Current-artifact end-to-end tests
        if: runner.os != 'Windows'
        run: pnpm --filter @mitojs/node-cli exec vitest run --config vitest.e2e.config.ts
      - name: Clean tarball installation and real SDK/CLI smoke
        run: pnpm run pack:local --output docs/reports/implementation/packages-ci.json
      - name: Unit test coverage
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm run test:coverage
      - name: Biome
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm run lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            docs/reports/coverage/
            docs/reports/implementation/packages-ci.json
